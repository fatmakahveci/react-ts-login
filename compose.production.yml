services:
  database:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forma -d forma']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://forma:${POSTGRES_PASSWORD}@database:5432/forma
      BETTER_AUTH_URL: https://${DOMAIN:?Set DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://forma:${POSTGRES_PASSWORD}@database:5432/forma
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: 'true'
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  database:
  certificates:
  caddy-config:
