services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma-local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forma -d forma']
      interval: 5s
      timeout: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  database:
